input:
  type: object
  required: [hits]
  properties:
    document_text:
      type: string
    hits:
      type: array
    min_score:
      type: number

output:
  type: object
  required: [decision, reason]
  properties:
    decision:
      type: string
      enum: [use, ask]
    document_ids:
      type: array
      items:
        type: string
    options:
      type: array
      items:
        type: string
        enum: [continue, ingest, drop, use]
    reason:
      type: string
