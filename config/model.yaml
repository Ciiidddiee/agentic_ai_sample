# Default: public Groq
# Note: llama-3.3-70b-versatile was deprecated for free/developer tiers (Aug 2026).
provider: groq                    # groq | gemini | openai | openai_compatible
model: openai/gpt-oss-20b
temperature: 0.2

# Optional overrides (used heavily for internal LLMs)
# model_id: openai/my-internal-model   # full LiteLLM id; skips provider/model join
# base_url: http://llm.internal.company:8000/v1
# api_key_env: INTERNAL_LLM_API_KEY    # env var name that holds the key
# timeout_seconds: 60

# Internal LLM example (swap values — no code change):
# provider: openai_compatible
# model: company-chat-v1
# base_url: http://llm.internal.company:8000/v1
# api_key_env: INTERNAL_LLM_API_KEY
# temperature: 0.2
