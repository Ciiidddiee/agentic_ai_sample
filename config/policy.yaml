allowed_tools:
  - ocr
  - search
  - ingest

# Similarity below min_score*0.5 → ask (human: continue | ingest | drop | use)
# Stronger scores → LLM chooses use | ask only (no automatic skip)
prior_context:
  min_score: 0.75

writes:
  # New documents may only enter the store via ingest
  knowledge_base: ingest_only
