[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai"
version = "0.1.0"
description = "Agentic PDF/Excel analysis with shared tools and per-agent skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "chromadb>=0.5.0",
    "litellm>=1.50.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
